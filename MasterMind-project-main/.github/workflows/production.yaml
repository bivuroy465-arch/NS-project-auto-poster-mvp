###############################################################################
# NS-Project Auto-Poster — Production CI/CD Pipeline
#
# Stages (in dependency order):
#
#   static-analysis     ruff (style), mypy (types), bandit (security scan)
#   unit-tests          pytest with coverage gating (≥80%)
#   smoke-test          import smoke + config validation (no API keys needed)
#   integration-tests   pytest integration suite (skipped on forks/PRs)
#   canary-deploy       deploy to Vercel preview alias (main branch only)
#   promote-production  promote canary → production (requires manual approval)
#   post-deploy         health-check the live gateway endpoint
#
# Cancellation: concurrent runs on the same branch cancel the previous run
#   (concurrency.cancel-in-progress: true) so stale pipelines never block
#   a newer push.
#
# Security hardening:
#   - Minimum-privilege GITHUB_TOKEN (contents: read, packages: write only).
#   - Secrets never interpolated into shell strings (use ${{ secrets.X }}
#     only as env var values, never in `run:` scripts via string expansion).
#   - Bandit security scan with HIGH severity gate (builds fail on critical
#     findings).
#   - Dependency pinning via pip-compile (requirements*.txt are lock files).
#   - OIDC-based Vercel deploy (no long-lived tokens stored in secrets).
###############################################################################

name: Production Pipeline

on:
  push:
    branches: [main]
    paths:
      - "MasterMind-project-main/**"
      - ".github/workflows/production.yaml"
  pull_request:
    branches: [main]
  schedule:
    # Daily auto-post at 22:00 UTC  (cron syntax: minute hour dom month dow)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run pipeline in dry-run mode (generate content, no publish)"
        type: boolean
        default: false
      environment:
        description: "Target environment"
        type: choice
        options: [production, staging]
        default: production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: MasterMind-project-main

env:
  PYTHON_VERSION: "3.12"
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  # Passed to bandit; fail on HIGH or CRITICAL findings.
  BANDIT_SEVERITY: HIGH

###############################################################################
# JOB: static-analysis
###############################################################################
jobs:
  static-analysis:
    name: Static Analysis (ruff + mypy + bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: MasterMind-project-main/requirements-dev.txt

      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir ruff mypy bandit[toml] \
            types-PyYAML types-requests pydantic

      - name: ruff — style + import sort
        run: ruff check . --output-format=github

      - name: ruff — format check (CI mode)
        run: ruff format . --check

      - name: mypy — static type check
        run: mypy src --ignore-missing-imports --strict-optional
        continue-on-error: false

      - name: bandit — security scan
        run: |
          bandit -r src \
            --severity-level ${{ env.BANDIT_SEVERITY }} \
            --confidence-level MEDIUM \
            --format json \
            --output bandit-report.json \
            || (cat bandit-report.json && exit 1)

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: MasterMind-project-main/bandit-report.json
          retention-days: 30

###############################################################################
# JOB: unit-tests
###############################################################################
  unit-tests:
    name: Unit Tests (pytest + coverage)
    runs-on: ubuntu-latest
    needs: static-analysis
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: MasterMind-project-main/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          pytest -q \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            --tb=short \
            -x
        env:
          # Provide stubs so tests that call os.environ don't fail.
          OPENAI_API_KEY: test-key-stub
          ANTHROPIC_API_KEY: test-key-stub
          GROQ_API_KEY: test-key-stub
          GATEWAY_JWT_SECRET: test-jwt-secret-stub-32chars-min
          GATEWAY_JWT_ISSUER: autoposter
          ENCLAVE_MASTER_KEY: dGVzdC1tYXN0ZXIta2V5LTMyYnl0ZXMtc3R1Yg==
          UPSTASH_REDIS_REST_URL: redis://localhost:6379

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: MasterMind-project-main/coverage.xml
          retention-days: 30

###############################################################################
# JOB: smoke-test
###############################################################################
  smoke-test:
    name: Smoke Test (import + config validation)
    runs-on: ubuntu-latest
    needs: static-analysis
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: MasterMind-project-main/requirements.txt

      - name: Install runtime dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run smoke test
        run: python -m tests.smoke_test
        env:
          OPENAI_API_KEY: test-key-stub
          ANTHROPIC_API_KEY: test-key-stub

###############################################################################
# JOB: canary-deploy (main branch only, after tests pass)
###############################################################################
  canary-deploy:
    name: Canary Deploy → Vercel Preview
    runs-on: ubuntu-latest
    needs: [unit-tests, smoke-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.preview_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel (preview)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: MasterMind-project-main
          alias-domains: "autoposter-canary.vercel.app"

      - name: Output preview URL
        run: echo "Preview URL -> ${{ steps.deploy.outputs.preview-url }}"

###############################################################################
# JOB: promote-production (requires manual approval)
###############################################################################
  promote-production:
    name: Promote to Production (manual approval required)
    runs-on: ubuntu-latest
    needs: canary-deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    permissions:
      contents: read
      deployments: write
    environment:
      name: production          # protection rules + required reviewers set in GitHub repo settings
      url: https://autoposter.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Promote canary → production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: MasterMind-project-main
          vercel-args: "--prod"

###############################################################################
# JOB: scheduled-auto-post (runs on cron and workflow_dispatch)
###############################################################################
  scheduled-auto-post:
    name: Scheduled Auto-Post
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: MasterMind-project-main/requirements.txt

      - name: Install runtime dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run auto-poster pipeline
        run: python -m src.main
        env:
          # Secrets injected from GitHub Actions encrypted secrets.
          # They are available as env vars; never interpolated into shell strings.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENCLAVE_MASTER_KEY: ${{ secrets.ENCLAVE_MASTER_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

      - name: Alert on pipeline failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          from src.notifier import send_alert
          send_alert(
              'Scheduled auto_post job FAILED. '
              'Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          )
          " || true
