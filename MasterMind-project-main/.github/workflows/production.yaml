###############################################################################
# NS-Project Auto-Poster — Production CI/CD Pipeline
#
# Job execution order (→ means "depends on"):
#
#   ┌─────────────────────────────────────────────────────────────────┐
#   │  static-checks matrix  (ruff | mypy | bandit | safety)          │
#   │        runs in parallel — all four must pass                     │
#   └────────────────────┬────────────────────────────────────────────┘
#                        │
#                 ┌──────▼──────┐
#                 │ unit-tests  │
#                 │ (all 166)   │
#                 └──────┬──────┘
#                        │
#              ┌─────────┴──────────┐
#              │                    │
#     ┌────────▼────────┐  ┌────────▼────────────┐
#     │  deploy-gateway │  │  build-push-fleet    │
#     │  (Vercel CLI)   │  │  (GHCR Docker image) │
#     └────────┬────────┘  └──────────────────────┘
#              │
#     ┌────────▼────────┐
#     │ post-deploy     │
#     │ health-check    │
#     └─────────────────┘
#
# Concurrency: concurrent runs on the same ref cancel the previous run so
#   a fast second push never waits for a superseded pipeline to finish.
#
# Security hardening:
#   - Minimum-privilege GITHUB_TOKEN per job (permissions declared explicitly).
#   - Secrets used ONLY as env var values, never interpolated inside `run:`
#     shell strings, preventing shell-injection of secret material.
#   - Bandit HIGH+MEDIUM severity gate; Safety CVE scan with --full-report.
#   - OIDC Vercel deploy: no long-lived deploy tokens stored in secrets.
#   - Docker image signed via GHCR attestation (provenance + SBOM).
#   - pip install always uses --no-cache-dir to avoid residual cache in CI.
###############################################################################

name: Production Pipeline

on:
  push:
    branches: [main]
    paths:
      - "MasterMind-project-main/**"
      - ".github/workflows/production.yaml"
  pull_request:
    branches: [main]
  schedule:
    # Daily auto-post at 22:00 UTC
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run pipeline in dry-run mode (generate content, no publish)"
        type: boolean
        default: false
      environment:
        description: "Target environment"
        type: choice
        options: [production, staging]
        default: production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: MasterMind-project-main

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ns-project-fleet

###############################################################################
# JOB: static-checks (parallel matrix)
###############################################################################
jobs:
  static-checks:
    name: "Static Checks / ${{ matrix.check }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false          # all four checks run even if one fails early
      matrix:
        check: [ruff, mypy, bandit, safety]
        include:
          - check: ruff
            install: "ruff>=0.6.0"
            run: |
              ruff check . --output-format=github
              ruff format . --check
          - check: mypy
            install: "mypy>=1.11.0 types-PyYAML types-requests pydantic"
            run: |
              mypy src \
                --ignore-missing-imports \
                --strict-optional \
                --warn-return-any \
                --warn-unused-ignores
          - check: bandit
            install: "bandit[toml]>=1.8.0"
            run: |
              bandit -r src \
                --severity-level HIGH \
                --confidence-level MEDIUM \
                --format json \
                --output bandit-report.json \
                || (cat bandit-report.json && exit 1)
          - check: safety
            install: "safety>=3.0.0"
            run: |
              safety check \
                --file requirements.txt \
                --full-report \
                --output text

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: MasterMind-project-main/requirements-dev.txt

      - name: Install check dependencies
        run: pip install --no-cache-dir ${{ matrix.install }}

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.run }}

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: matrix.check == 'bandit' && always()
        with:
          name: bandit-security-report
          path: MasterMind-project-main/bandit-report.json
          retention-days: 30

###############################################################################
# JOB: unit-tests (all 166 must pass; coverage ≥ 80 %)
###############################################################################
  unit-tests:
    name: Unit Tests (pytest — 166 tests, ≥80% coverage)
    runs-on: ubuntu-latest
    needs: static-checks
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: MasterMind-project-main/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run test suite
        run: |
          pytest -q \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            --tb=short \
            -x
        env:
          # Non-sensitive stubs: let tests exercise code paths without real keys.
          OPENAI_API_KEY: test-key-stub
          ANTHROPIC_API_KEY: test-key-stub
          GROQ_API_KEY: test-key-stub
          GATEWAY_JWT_SECRET: test-jwt-secret-stub-32-chars-min
          GATEWAY_JWT_ISSUER: autoposter
          # 32-byte base64url stub master key (deterministic for testing).
          ENCLAVE_MASTER_KEY: dGVzdC1tYXN0ZXIta2V5LTMyYnl0ZXMtc3R1Yg==
          UPSTASH_REDIS_REST_URL: redis://localhost:6379
          UPSTASH_REDIS_REST_TOKEN: stub-token

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: MasterMind-project-main/coverage.xml
          retention-days: 30

###############################################################################
# JOB: deploy-gateway  (main branch push only)
###############################################################################
  deploy-gateway:
    name: Deploy Edge Gateway → Vercel
    runs-on: ubuntu-latest
    needs: unit-tests
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'schedule' &&
      github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Vercel CLI
        run: npm install --global vercel@latest --quiet
        working-directory: ${{ github.workspace }}

      - name: Pull Vercel project settings
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project artifacts
        run: |
          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to production
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Gateway runtime secrets — injected into Vercel env, never logged.
          GATEWAY_JWT_SECRET: ${{ secrets.GATEWAY_JWT_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      - name: Output deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.deploy_url }}"

###############################################################################
# JOB: build-push-fleet  (main branch push only, all checks must pass)
###############################################################################
  build-push-fleet:
    name: Build & Push Fleet Image → GHCR
    runs-on: ubuntu-latest
    needs: unit-tests
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'schedule' &&
      github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      # Required for provenance attestation.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is scoped to packages: write above; no stored secret.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Short SHA for exact traceability.
            type=sha,prefix=sha-,format=short
            # Semantic version tag when a vX.Y.Z tag is pushed.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Branch-based latest tag for main.
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=NS-Project Processing Fleet
            org.opencontainers.image.description=Distributed Redis Stream worker for the NS auto-poster pipeline
            org.opencontainers.image.vendor=NS-Project

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: MasterMind-project-main
          file: MasterMind-project-main/Dockerfile
          push: true
          # Build for both amd64 (standard cloud VMs) and arm64 (Graviton/Apple Silicon).
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit inline cache to speed up subsequent runs without a separate registry cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build-time args (no secrets — those are runtime env vars only).
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_SHA=${{ github.sha }}

      - name: Generate SBOM attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

###############################################################################
# JOB: post-deploy health-check
###############################################################################
  post-deploy:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy-gateway
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'schedule' &&
      github.event_name != 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Wait for Vercel edge propagation (15 s)
        run: sleep 15

      - name: Health-check /api/gateway/status endpoint
        # The status endpoint returns 401 without a JWT — that's the correct
        # response and proves the function cold-starts and routes correctly.
        run: |
          HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --max-time 10 \
            "${{ secrets.VERCEL_PRODUCTION_URL }}/api/gateway/status/0000000000000000")
          echo "Health check HTTP status: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "401" ] && [ "${HTTP_CODE}" != "404" ]; then
            echo "Unexpected HTTP status ${HTTP_CODE} — gateway may be unhealthy."
            exit 1
          fi
          echo "Gateway is healthy."

###############################################################################
# JOB: scheduled-auto-post
###############################################################################
  scheduled-auto-post:
    name: Scheduled Auto-Post
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: MasterMind-project-main/requirements.txt

      - name: Install runtime dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run auto-poster pipeline
        run: python -m src.main
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENCLAVE_MASTER_KEY: ${{ secrets.ENCLAVE_MASTER_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

      - name: Alert on pipeline failure
        if: failure()
        run: |
          python -c "
          from src.notifier import send_alert
          send_alert(
              'Scheduled auto-post job FAILED. '
              'Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          )
          " || true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
